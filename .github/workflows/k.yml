name: Build Il2CppDumper ARM64 & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 .NET 6.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: 克隆 Il2CppDumper 源码
        run: |
          git clone --depth 1 --branch master https://github.com/Perfare/Il2CppDumper.git
          echo "CLONE_DIR=$(pwd)/Il2CppDumper" >> $GITHUB_ENV

      - name: 确认项目目录结构
        run: |
          cd $CLONE_DIR
          ls -d Il2CppDumper-net6 || (echo "ERROR: Il2CppDumper-net6 not found" && exit 1)

      - name: 交叉编译 ARM64 自包含版本
        run: |
          cd $CLONE_DIR/Il2CppDumper-net6
          dotnet publish -c Release -r linux-arm64 --self-contained true -o publish

      - name: 打包可执行文件
        run: |
          cd $CLONE_DIR/Il2CppDumper-net6/publish
          chmod +x Il2CppDumper
          tar czf $GITHUB_WORKSPACE/il2cpp-arm64.tar.gz .
          echo "Archive created at $GITHUB_WORKSPACE/il2cpp-arm64.tar.gz"

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: il2cpp-arm64-${{ github.run_number }}
          name: Il2CppDumper ARM64 - Build ${{ github.run_number }}
          body: |
            自动构建的 Il2CppDumper ARM64 原生版本。
            使用方法：
            ```bash
            tar xzf il2cpp-arm64.tar.gz
            ./Il2CppDumper libil2cpp.so global-metadata.dat output_dir
            ```
          files: il2cpp-arm64.tar.gz