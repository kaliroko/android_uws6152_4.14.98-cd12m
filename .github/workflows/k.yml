name: Build Il2CppDumper ARM64 & Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 .NET 6.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: 递归克隆 Il2CppDumper 仓库
        run: |
          git clone --depth 1 --recursive https://github.com/Perfare/Il2CppDumper.git
          echo "CLONE_DIR=$(pwd)/Il2CppDumper" >> $GITHUB_ENV

      - name: 显示目录结构（用于调试）
        run: |
          cd $CLONE_DIR
          find . -maxdepth 2 -type d

      - name: 查找并编译 Il2CppDumper 项目
        run: |
          cd $CLONE_DIR
          # 寻找包含 Il2CppDumper.csproj 的目录
          PROJ_DIR=$(find . -name "Il2CppDumper.csproj" -exec dirname {} \; | head -1)
          if [ -z "$PROJ_DIR" ]; then
            echo "错误：未找到 Il2CppDumper.csproj"
            exit 1
          fi
          echo "找到项目目录：$PROJ_DIR"
          cd "$PROJ_DIR"
          # 明确指定目标框架为 net6.0 并发布 ARM64 自包含版本
          dotnet publish -c Release -r linux-arm64 --self-contained true -f net6.0 -o publish
          echo "PUBLISH_DIR=$(pwd)/publish" >> $GITHUB_ENV

      - name: 打包可执行文件
        run: |
          cd $PUBLISH_DIR
          chmod +x Il2CppDumper
          tar czf $GITHUB_WORKSPACE/il2cpp-arm64.tar.gz .
          ls -la $GITHUB_WORKSPACE/il2cpp-arm64.tar.gz

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: il2cpp-arm64-${{ github.run_number }}
          name: Il2CppDumper ARM64 - Build ${{ github.run_number }}
          body: |
            Il2CppDumper 原生 ARM64 版本（自包含）。
            使用方法：
            ```bash
            tar xzf il2cpp-arm64.tar.gz
            ./Il2CppDumper libil2cpp.so global-metadata.dat output_dir
            ```
          files: il2cpp-arm64.tar.gz