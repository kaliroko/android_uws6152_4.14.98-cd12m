name: Build Il2CppDumper ARM64 & Release

on:
  workflow_dispatch:        # 手动触发，需要的时候运行一次

permissions:
  contents: write           # 允许创建 Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 安装 .NET 6.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: 克隆 Il2CppDumper 源码
        run: git clone https://github.com/Perfare/Il2CppDumper.git

      - name: 交叉编译 ARM64 自包含版本
        run: |
          cd Il2CppDumper/Il2CppDumper-net6
          dotnet publish -c Release -r linux-arm64 --self-contained true -o publish

      - name: 打包可执行文件
        run: |
          cd Il2CppDumper/Il2CppDumper-net6/publish
          chmod +x Il2CppDumper
          tar czf ../../../il2cpp-arm64.tar.gz .
          cd ../../..

      - name: 创建 Release 并上传文件
        uses: softprops/action-gh-release@v2
        with:
          tag_name: il2cpp-arm64-${{ github.run_number }}
          name: Il2CppDumper ARM64 - Build ${{ github.run_number }}
          body: |
            自动构建的 Il2CppDumper ARM64 原生版本。
            - 构建日期：${{ github.event.repository.updated_at }}
            - 运行编号：${{ github.run_number }}
            使用方法：
            ```bash
            tar xzf il2cpp-arm64.tar.gz
            ./Il2CppDumper libil2cpp.so global-metadata.dat output_dir
            ```
          files: il2cpp-arm64.tar.gz