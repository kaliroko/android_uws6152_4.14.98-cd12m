name: Cross-Compile DeepSeek Harness for ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Replace node-pty in package.json files
        working-directory: deepseek-harness
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (entry.name !== 'node_modules' && entry.name !== '.git') walk(full);
              } else if (entry.name === 'package.json') {
                let data = JSON.parse(fs.readFileSync(full, 'utf8'));
                const replaceDep = (obj) => {
                  if (obj && typeof obj === 'object') {
                    if (obj['node-pty'] !== undefined) {
                      obj['@homebridge/node-pty-prebuilt-multiarch'] = '^0.14.1';
                      delete obj['node-pty'];
                    }
                    // 递归处理所有对象字段
                    for (const key of Object.keys(obj)) {
                      if (typeof obj[key] === 'object') replaceDep(obj[key]);
                    }
                  }
                };
                replaceDep(data);
                // 同时删除所有 patchedDependencies
                const removeField = (obj) => {
                  if (obj && typeof obj === 'object') {
                    delete obj.patchedDependencies;
                    for (const key of Object.keys(obj)) {
                      if (typeof obj[key] === 'object') removeField(obj[key]);
                    }
                  }
                };
                removeField(data);
                fs.writeFileSync(full, JSON.stringify(data, null, 2));
              }
            }
          }
          walk('.');
          NODE

      - name: Replace node-pty in source files (js/ts/mjs/cjs)
        working-directory: deepseek-harness
        run: |
          find . -type f \( -name "*.js" -o -name "*.ts" -o -name "*.mjs" -o -name "*.cjs" -o -name "*.jsx" -o -name "*.tsx" \) -not -path "*/node_modules/*" -exec sed -i 's/require("node-pty")/require("@homebridge\/node-pty-prebuilt-multiarch")/g; s/require('"'"'node-pty'"'"')/require("@homebridge\/node-pty-prebuilt-multiarch")/g; s/import "node-pty"/import "@homebridge\/node-pty-prebuilt-multiarch"/g; s/import '"'"'node-pty'"'"'/import "@homebridge\/node-pty-prebuilt-multiarch"/g; s/from "node-pty"/from "@homebridge\/node-pty-prebuilt-multiarch"/g; s/from '"'"'node-pty'"'"'/from "@homebridge\/node-pty-prebuilt-multiarch"/g' {} \;

      - name: Remove patchedDependencies from pnpm-workspace.yaml if exists
        working-directory: deepseek-harness
        run: |
          if [ -f pnpm-workspace.yaml ]; then
            sed -i '/^[[:space:]]*patchedDependencies:/,/^[^[:space:]]/d' pnpm-workspace.yaml
          fi

      - name: Remove lockfile
        working-directory: deepseek-harness
        run: rm -f pnpm-lock.yaml

      - name: Configure ARM64 target
        working-directory: deepseek-harness
        run: |
          echo "supportedArchitectures[linux][arm64]=true" >> .npmrc
          echo "npm_config_arch=arm64" >> .npmrc
          echo "npm_config_target_arch=arm64" >> .npmrc
          echo "npm_config_platform=linux" >> .npmrc

      - name: Install dependencies
        working-directory: deepseek-harness
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64
          npm_config_platform: linux
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        working-directory: deepseek-harness
        run: pnpm run build

      - name: Package artifacts
        run: |
          mkdir -p release
          cp -r deepseek-harness/packages/dsh/dist release/
          cp deepseek-harness/packages/dsh/package.json release/
          tar -czvf deepseek-harness-arm64.tar.gz -C release .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: deepseek-harness-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}