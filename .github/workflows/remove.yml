name: Cross-Compile DeepSeek Harness for ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest          # 如果您的 GitHub 账户支持 ARM64 runner，可改为 ubuntu-24.04-arm 并删除 ARM64 配置步骤
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      # 删除所有 package.json 中任意位置的 patchedDependencies 字段
      - name: Remove patchedDependencies from all package.json
        working-directory: deepseek-harness
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (entry.name !== 'node_modules' && entry.name !== '.git') walk(full);
              } else if (entry.name === 'package.json') {
                const data = JSON.parse(fs.readFileSync(full, 'utf8'));
                const removeField = (obj) => {
                  if (!obj || typeof obj !== 'object') return;
                  delete obj.patchedDependencies;
                  for (const key of Object.keys(obj)) {
                    if (typeof obj[key] === 'object') removeField(obj[key]);
                  }
                };
                removeField(data);
                fs.writeFileSync(full, JSON.stringify(data, null, 2));
              }
            }
          }
          walk('.');
          NODE

      - name: Remove lockfile
        working-directory: deepseek-harness
        run: rm -f pnpm-lock.yaml

      # 配置 ARM64 目标，并使用 pnpm overrides 将 node-pty 替换为预编译包
      - name: Configure pnpm for ARM64 and node-pty override
        working-directory: deepseek-harness
        run: |
          echo "supportedArchitectures[linux][arm64]=true" >> .npmrc
          echo "npm_config_arch=arm64" >> .npmrc
          echo "npm_config_target_arch=arm64" >> .npmrc
          echo "npm_config_platform=linux" >> .npmrc
          echo "overrides[node-pty]=npm:@homebridge/node-pty-prebuilt-multiarch@^0.14.1" >> .npmrc

      - name: Install dependencies
        working-directory: deepseek-harness
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64
          npm_config_platform: linux
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        working-directory: deepseek-harness
        run: pnpm run build

      # 动态查找并打包构建产物（自动适应目录结构）
      - name: Package artifacts
        run: |
          cd deepseek-harness
          echo "===== 当前目录: $(pwd) ====="
          echo "===== 顶层目录结构 ====="
          ls -la
          echo "===== 查找所有构建输出目录 (dist/build/lib/out) ====="
          # 查找 packages 目录下所有可能的构建输出目录
          BUILD_DIRS=$(find packages -type d \( -name dist -o -name build -o -name lib -o -name out \) -not -path "*/node_modules/*" 2>/dev/null)
          if [ -n "$BUILD_DIRS" ]; then
            echo "找到以下构建目录:"
            echo "$BUILD_DIRS"
            # 创建 release 目录
            mkdir -p ../release
            # 遍历每个构建目录，将其内容复制到 release 中，保持包名结构
            echo "$BUILD_DIRS" | while read -r dir; do
              # 获取包名（构建目录的上一级目录名）
              pkg_dir=$(dirname "$dir")
              pkg_name=$(basename "$pkg_dir")
              echo "处理包: $pkg_name  (来自 $dir)"
              mkdir -p "../release/$pkg_name"
              # 复制构建产物
              cp -r "$dir"/* "../release/$pkg_name/"
              # 如果包的 package.json 存在，则复制
              if [ -f "$pkg_dir/package.json" ]; then
                cp "$pkg_dir/package.json" "../release/$pkg_name/"
              fi
            done
            echo "已将所有构建产物复制到 release 目录。"
          else
            echo "未找到常见构建目录，回退打包整个项目（排除 node_modules 等）"
            mkdir -p ../release
            # 复制整个项目，排除不必要的目录
            tar -cf - --exclude=node_modules --exclude=.git --exclude=release . | tar -xf - -C ../release
          fi
          cd ..
          echo "===== release 目录内容 ====="
          ls -la release/
          echo "===== 创建最终 tar 包 ====="
          tar -czvf deepseek-harness-arm64.tar.gz -C release .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: deepseek-harness-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}