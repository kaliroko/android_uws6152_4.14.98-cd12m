name: Cross-Compile DeepSeek Harness for ARM64 (Self-Contained)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本号 (例如 v1.0.0)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest          # 若支持 ARM64 原生 runner，可改为 ubuntu-24.04-arm 并删除架构配置步骤
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Remove patchedDependencies from all package.json
        working-directory: deepseek-harness
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (entry.name !== 'node_modules' && entry.name !== '.git') walk(full);
              } else if (entry.name === 'package.json') {
                const data = JSON.parse(fs.readFileSync(full, 'utf8'));
                const removeField = (obj) => {
                  if (!obj || typeof obj !== 'object') return;
                  delete obj.patchedDependencies;
                  for (const key of Object.keys(obj)) {
                    if (typeof obj[key] === 'object') removeField(obj[key]);
                  }
                };
                removeField(data);
                fs.writeFileSync(full, JSON.stringify(data, null, 2));
              }
            }
          }
          walk('.');
          NODE

      - name: Remove lockfile
        working-directory: deepseek-harness
        run: rm -f pnpm-lock.yaml

      - name: Configure pnpm for ARM64 and node-pty override
        working-directory: deepseek-harness
        run: |
          echo "supportedArchitectures[linux][arm64]=true" >> .npmrc
          echo "npm_config_arch=arm64" >> .npmrc
          echo "npm_config_target_arch=arm64" >> .npmrc
          echo "npm_config_platform=linux" >> .npmrc
          echo "overrides[node-pty]=npm:@homebridge/node-pty-prebuilt-multiarch@^0.14.1" >> .npmrc

      - name: Install dependencies
        working-directory: deepseek-harness
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64
          npm_config_platform: linux
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        working-directory: deepseek-harness
        run: pnpm run build

      - name: Deploy dsh package with production dependencies
        working-directory: deepseek-harness
        run: |
          pnpm --filter @deepseek-ai/dsh deploy --prod --legacy ./deploy/dsh
          echo "===== 部署目录内容 ====="
          ls -la ./deploy/dsh
          echo "===== node_modules 是否存在 ====="
          ls -la ./deploy/dsh/node_modules || echo "node_modules 不存在"
          echo "===== 递归查找可能的入口文件 ====="
          find ./deploy/dsh -maxdepth 3 -type f \( -name "index.js" -o -name "main.js" -o -name "cli.js" \) | head -n 20

      # 新增步骤：补全所有缺失的 @deepseek-ai 内部包（排除 node_modules，避免符号链接循环）
      - name: Copy missing internal workspace packages
        working-directory: deepseek-harness
        run: |
          echo "补全内部 @deepseek-ai 包..."
          mkdir -p deploy/dsh/node_modules/@deepseek-ai
          for pkg_dir in $(find packages -maxdepth 3 -name package.json -exec dirname {} \;); do
            pkg_name=$(node -p "require('./$pkg_dir/package.json').name" 2>/dev/null)
            if [[ "$pkg_name" == @deepseek-ai/* ]]; then
              target="deploy/dsh/node_modules/$pkg_name"
              if [ ! -e "$target" ]; then
                echo "复制缺失包: $pkg_name (来自 $pkg_dir)"
                mkdir -p "$(dirname "$target")"
                # 使用 tar 复制，排除 node_modules，不跟随符号链接，避免循环
                tar -cf - --exclude=node_modules --exclude=.git -C "$pkg_dir" . | tar -xf - -C "$target"
              else
                echo "已存在: $pkg_name"
              fi
            fi
          done
          echo "补全完成。"
          echo "===== 检查 node_modules/@deepseek-ai 内容 ====="
          ls -la deploy/dsh/node_modules/@deepseek-ai

      - name: Package full self-contained artifacts
        run: |
          cd deepseek-harness/deploy/dsh
          echo "===== 确认部署目录非空 ====="
          if [ -z "$(ls -A .)" ]; then
            echo "错误：部署目录为空，请检查 deploy 步骤。"
            exit 1
          fi
          tar -czvf ../../../deepseek-harness-arm64-full.tar.gz .
          cd ../../..
          echo "===== 打包完成，压缩包大小 ====="
          ls -lh deepseek-harness-arm64-full.tar.gz
          echo "===== 压缩包内容预览 ====="
          tar -tzf deepseek-harness-arm64-full.tar.gz | head -20

      - name: Upload to Release (Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: deepseek-harness-arm64-full.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and Upload (Manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          echo "使用标签: $TAG_NAME"
          echo "目标仓库: $GITHUB_REPOSITORY"
          echo "目标分支: $GITHUB_REF_NAME"
          
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 已存在，上传资产..."
            gh release upload "$TAG_NAME" ./deepseek-harness-arm64-full.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "创建新 Release 并上传资产..."
            gh release create "$TAG_NAME" ./deepseek-harness-arm64-full.tar.gz \
              --title "$TAG_NAME" \
              --notes "Release $TAG_NAME (ARM64 full self-contained)" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_REF_NAME"
          fi