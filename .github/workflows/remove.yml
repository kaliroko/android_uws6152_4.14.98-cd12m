name: Cross-Compile DeepSeek Harness for ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Add override and remove patches
        working-directory: deepseek-harness
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          // 1. 处理根 package.json：添加 pnpm.overrides 并删除 patchedDependencies
          const rootPkgPath = 'package.json';
          let rootPkg = JSON.parse(fs.readFileSync(rootPkgPath, 'utf8'));
          rootPkg.pnpm = rootPkg.pnpm || {};
          rootPkg.pnpm.overrides = rootPkg.pnpm.overrides || {};
          rootPkg.pnpm.overrides['node-pty'] = 'npm:@homebridge/node-pty-prebuilt-multiarch@^0.14.1';
          delete rootPkg.patchedDependencies;
          if (rootPkg.pnpm) delete rootPkg.pnpm.patchedDependencies;
          fs.writeFileSync(rootPkgPath, JSON.stringify(rootPkg, null, 2));

          // 2. 递归删除所有 package.json 中的 patchedDependencies（任意层级）
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (entry.name !== 'node_modules' && entry.name !== '.git') walk(full);
              } else if (entry.name === 'package.json') {
                const data = JSON.parse(fs.readFileSync(full, 'utf8'));
                const removeField = (obj) => {
                  if (!obj || typeof obj !== 'object') return;
                  delete obj.patchedDependencies;
                  for (const key of Object.keys(obj)) {
                    if (typeof obj[key] === 'object') removeField(obj[key]);
                  }
                };
                removeField(data);
                fs.writeFileSync(full, JSON.stringify(data, null, 2));
              }
            }
          }
          walk('.');
          console.log('Override added and patches removed.');
          NODE

      - name: Remove lockfile
        working-directory: deepseek-harness
        run: rm -f pnpm-lock.yaml

      - name: Configure ARM64 target
        working-directory: deepseek-harness
        run: |
          echo "supportedArchitectures[linux][arm64]=true" >> .npmrc
          echo "npm_config_arch=arm64" >> .npmrc
          echo "npm_config_target_arch=arm64" >> .npmrc
          echo "npm_config_platform=linux" >> .npmrc

      - name: Install dependencies
        working-directory: deepseek-harness
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64
          npm_config_platform: linux
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        working-directory: deepseek-harness
        run: pnpm run build

      - name: Package artifacts
        run: |
          mkdir -p release
          cp -r deepseek-harness/packages/dsh/dist release/
          cp deepseek-harness/packages/dsh/package.json release/
          tar -czvf deepseek-harness-arm64.tar.gz -C release .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: deepseek-harness-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}