name: Cross-Compile DeepSeek Harness for ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Patch node-pty references
        working-directory: deepseek-harness
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (entry.name !== 'node_modules' && entry.name !== '.git') walk(full);
              } else {
                const ext = path.extname(entry.name).toLowerCase();
                if (['.js', '.ts', '.mjs', '.cjs', '.jsx', '.tsx', '.json'].includes(ext)) {
                  let content = fs.readFileSync(full, 'utf8');
                  // 替换所有 require/import 中的 'node-pty' 或 "node-pty"
                  content = content.replace(/["']node-pty["']/g, '"@homebridge/node-pty-prebuilt-multiarch"');
                  // 如果是 package.json，还需要正确替换依赖项
                  if (entry.name === 'package.json') {
                    try {
                      const json = JSON.parse(content);
                      const replaceDep = (obj) => {
                        if (obj && typeof obj === 'object') {
                          if (obj['node-pty'] !== undefined) {
                            obj['@homebridge/node-pty-prebuilt-multiarch'] = '^0.14.1';
                            delete obj['node-pty'];
                          }
                          for (const key of Object.keys(obj)) {
                            if (typeof obj[key] === 'object') replaceDep(obj[key]);
                          }
                        }
                      };
                      replaceDep(json);
                      content = JSON.stringify(json, null, 2);
                    } catch (e) {
                      console.log(`Could not parse ${full}: ${e.message}`);
                    }
                  }
                  fs.writeFileSync(full, content);
                }
              }
            }
          }
          walk('.');
          NODE

      - name: Remove patchedDependencies from JSON files
        working-directory: deepseek-harness
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (entry.name !== 'node_modules' && entry.name !== '.git') walk(full);
              } else if (entry.name === 'package.json') {
                const data = JSON.parse(fs.readFileSync(full, 'utf8'));
                const removeField = (obj) => {
                  if (obj && typeof obj === 'object') {
                    delete obj.patchedDependencies;
                    for (const key of Object.keys(obj)) {
                      if (typeof obj[key] === 'object') removeField(obj[key]);
                    }
                  }
                };
                removeField(data);
                fs.writeFileSync(full, JSON.stringify(data, null, 2));
              }
            }
          }
          walk('.');
          NODE

      - name: Remove patchedDependencies from pnpm-workspace.yaml
        working-directory: deepseek-harness
        run: |
          if [ -f pnpm-workspace.yaml ]; then
            sed -i '/^[[:space:]]*patchedDependencies:/,/^[^[:space:]]/d' pnpm-workspace.yaml
          fi

      - name: Remove lockfile
        working-directory: deepseek-harness
        run: rm -f pnpm-lock.yaml

      - name: Configure ARM64 target
        working-directory: deepseek-harness
        run: |
          echo "supportedArchitectures[linux][arm64]=true" >> .npmrc
          echo "npm_config_arch=arm64" >> .npmrc
          echo "npm_config_target_arch=arm64" >> .npmrc
          echo "npm_config_platform=linux" >> .npmrc

      - name: Install dependencies
        working-directory: deepseek-harness
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64
          npm_config_platform: linux
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        working-directory: deepseek-harness
        run: pnpm run build

      - name: Package artifacts
        run: |
          mkdir -p release
          cp -r deepseek-harness/packages/dsh/dist release/
          cp deepseek-harness/packages/dsh/package.json release/
          tar -czvf deepseek-harness-arm64.tar.gz -C release .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: deepseek-harness-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}