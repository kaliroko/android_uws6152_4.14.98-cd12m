name: Cross-Compile DeepSeek Harness for ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本号 (例如 v1.0.0)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest          # 如需原生 ARM64 构建，可改为 ubuntu-24.04-arm 并删除 ARM64 配置步骤
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      # 删除所有 package.json 中任意位置的 patchedDependencies 字段
      - name: Remove patchedDependencies from all package.json
        working-directory: deepseek-harness
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (entry.name !== 'node_modules' && entry.name !== '.git') walk(full);
              } else if (entry.name === 'package.json') {
                const data = JSON.parse(fs.readFileSync(full, 'utf8'));
                const removeField = (obj) => {
                  if (!obj || typeof obj !== 'object') return;
                  delete obj.patchedDependencies;
                  for (const key of Object.keys(obj)) {
                    if (typeof obj[key] === 'object') removeField(obj[key]);
                  }
                };
                removeField(data);
                fs.writeFileSync(full, JSON.stringify(data, null, 2));
              }
            }
          }
          walk('.');
          NODE

      - name: Remove lockfile
        working-directory: deepseek-harness
        run: rm -f pnpm-lock.yaml

      # 配置 ARM64 目标，并使用 pnpm overrides 将 node-pty 替换为预编译包
      - name: Configure pnpm for ARM64 and node-pty override
        working-directory: deepseek-harness
        run: |
          echo "supportedArchitectures[linux][arm64]=true" >> .npmrc
          echo "npm_config_arch=arm64" >> .npmrc
          echo "npm_config_target_arch=arm64" >> .npmrc
          echo "npm_config_platform=linux" >> .npmrc
          echo "overrides[node-pty]=npm:@homebridge/node-pty-prebuilt-multiarch@^0.14.1" >> .npmrc

      - name: Install dependencies
        working-directory: deepseek-harness
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64
          npm_config_platform: linux
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        working-directory: deepseek-harness
        run: pnpm run build

      # 动态查找并打包构建产物（自动适应目录结构）
      - name: Package artifacts
        run: |
          cd deepseek-harness
          echo "===== 当前目录: $(pwd) ====="
          echo "===== 顶层目录结构 ====="
          ls -la
          echo "===== 查找所有构建输出目录 (dist/build/lib/out) ====="
          BUILD_DIRS=$(find packages -type d \( -name dist -o -name build -o -name lib -o -name out \) -not -path "*/node_modules/*" 2>/dev/null)
          if [ -n "$BUILD_DIRS" ]; then
            echo "找到以下构建目录:"
            echo "$BUILD_DIRS"
            mkdir -p ../release
            echo "$BUILD_DIRS" | while read -r dir; do
              pkg_dir=$(dirname "$dir")
              pkg_name=$(basename "$pkg_dir")
              echo "处理包: $pkg_name  (来自 $dir)"
              mkdir -p "../release/$pkg_name"
              cp -r "$dir"/* "../release/$pkg_name/"
              if [ -f "$pkg_dir/package.json" ]; then
                cp "$pkg_dir/package.json" "../release/$pkg_name/"
              fi
            done
            echo "已将所有构建产物复制到 release 目录。"
          else
            echo "未找到常见构建目录，回退打包整个项目（排除 node_modules 等）"
            mkdir -p ../release
            tar -cf - --exclude=node_modules --exclude=.git --exclude=release . | tar -xf - -C ../release
          fi
          cd ..
          echo "===== release 目录内容 ====="
          ls -la release/
          echo "===== 创建最终 tar 包 ====="
          tar -czvf deepseek-harness-arm64.tar.gz -C release .

      # 发布方式一：推送标签自动触发时使用 softprops/action-gh-release
      - name: Upload to Release (Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: deepseek-harness-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 发布方式二：手动触发时使用 GitHub CLI 创建标签并发布
      - name: Create Release and Upload (Manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          # 确保标签存在，如果不存在则创建（基于当前默认分支最新提交）
          if ! git rev-parse "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating tag $TAG_NAME"
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          else
            echo "Tag $TAG_NAME already exists"
          fi
          # 使用 GitHub CLI 创建/更新 Release 并上传资产
          gh release create "$TAG_NAME" ./deepseek-harness-arm64.tar.gz \
            --title "$TAG_NAME" \
            --notes "Release $TAG_NAME (ARM64 build)" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA"
          # 如果 Release 已存在，则更新资产
          if [ $? -ne 0 ]; then
            echo "Release might already exist, trying to upload asset..."
            gh release upload "$TAG_NAME" ./deepseek-harness-arm64.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          fi