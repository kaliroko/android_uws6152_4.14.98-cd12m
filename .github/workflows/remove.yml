name: Cross-Compile DeepSeek Harness for ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本号 (例如 v1.0.0)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest          # 如需原生 ARM64 构建，可改为 ubuntu-24.04-arm 并删除 ARM64 配置步骤
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      # 1. 递归删除所有 package.json 中任意位置的 patchedDependencies 字段
      - name: Remove patchedDependencies from all package.json
        working-directory: deepseek-harness
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (entry.name !== 'node_modules' && entry.name !== '.git') walk(full);
              } else if (entry.name === 'package.json') {
                const data = JSON.parse(fs.readFileSync(full, 'utf8'));
                const removeField = (obj) => {
                  if (!obj || typeof obj !== 'object') return;
                  delete obj.patchedDependencies;
                  for (const key of Object.keys(obj)) {
                    if (typeof obj[key] === 'object') removeField(obj[key]);
                  }
                };
                removeField(data);
                fs.writeFileSync(full, JSON.stringify(data, null, 2));
              }
            }
          }
          walk('.');
          NODE

      # 2. 删除锁文件
      - name: Remove lockfile
        working-directory: deepseek-harness
        run: rm -f pnpm-lock.yaml

      # 3. 配置 ARM64 目标，并使用 pnpm overrides 替换 node-pty
      - name: Configure pnpm for ARM64 and node-pty override
        working-directory: deepseek-harness
        run: |
          echo "supportedArchitectures[linux][arm64]=true" >> .npmrc
          echo "npm_config_arch=arm64" >> .npmrc
          echo "npm_config_target_arch=arm64" >> .npmrc
          echo "npm_config_platform=linux" >> .npmrc
          echo "overrides[node-pty]=npm:@homebridge/node-pty-prebuilt-multiarch@^0.14.1" >> .npmrc

      # 4. 安装依赖
      - name: Install dependencies
        working-directory: deepseek-harness
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64
          npm_config_platform: linux
        run: pnpm install --no-frozen-lockfile

      # 5. 构建
      - name: Build project
        working-directory: deepseek-harness
        run: pnpm run build

      # 6. 灵活打包：自动查找所有构建输出目录
      - name: Package artifacts
        run: |
          cd deepseek-harness
          echo "===== 查找所有构建输出目录 (dist/build/lib/out) ====="
          BUILD_DIRS=$(find packages -type d \( -name dist -o -name build -o -name lib -o -name out \) -not -path "*/node_modules/*" 2>/dev/null)
          if [ -z "$BUILD_DIRS" ]; then
            echo "错误：未找到任何构建输出目录，请检查构建日志。"
            exit 1
          fi
          echo "找到以下构建目录："
          echo "$BUILD_DIRS"
          mkdir -p ../release
          echo "$BUILD_DIRS" | while IFS= read -r dir; do
            # 获取包目录（构建目录的上一级）
            pkg_dir=$(dirname "$dir")
            pkg_name=$(basename "$pkg_dir")
            echo "处理包: $pkg_name (来自 $dir)"
            mkdir -p "../release/$pkg_name"
            # 复制构建产物
            cp -r "$dir"/* "../release/$pkg_name/"
            # 如果存在 package.json，则复制
            if [ -f "$pkg_dir/package.json" ]; then
              cp "$pkg_dir/package.json" "../release/$pkg_name/"
            fi
          done
          cd ..
          echo "===== release 目录内容 ====="
          ls -la release/
          echo "===== 创建最终 tar 包 ====="
          tar -czvf deepseek-harness-arm64.tar.gz -C release .

      # 7a. 推送标签自动触发时，使用 softprops/action-gh-release 发布
      - name: Upload to Release (Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: deepseek-harness-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7b. 手动触发时，使用 GitHub CLI 创建标签并发布
      - name: Create Release and Upload (Manual)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          echo "使用标签: $TAG_NAME"
          echo "目标仓库: $GITHUB_REPOSITORY"
          echo "目标分支: $GITHUB_REF_NAME"
          
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 已存在，上传资产..."
            gh release upload "$TAG_NAME" ./deepseek-harness-arm64.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "创建新 Release 并上传资产..."
            gh release create "$TAG_NAME" ./deepseek-harness-arm64.tar.gz \
              --title "$TAG_NAME" \
              --notes "Release $TAG_NAME (ARM64 build)" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_REF_NAME"
          fi