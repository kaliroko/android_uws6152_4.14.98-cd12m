name: Cross-Compile DeepSeek Harness for ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest          # 如需原生 ARM64 构建，可改为 ubuntu-24.04-arm 并移除 ARM64 配置步骤
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          path: deepseek-harness

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Remove patchedDependencies from all package.json
        working-directory: deepseek-harness
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (entry.name !== 'node_modules' && entry.name !== '.git') walk(full);
              } else if (entry.name === 'package.json') {
                const data = JSON.parse(fs.readFileSync(full, 'utf8'));
                const removeField = (obj) => {
                  if (!obj || typeof obj !== 'object') return;
                  delete obj.patchedDependencies;
                  for (const key of Object.keys(obj)) {
                    if (typeof obj[key] === 'object') removeField(obj[key]);
                  }
                };
                removeField(data);
                fs.writeFileSync(full, JSON.stringify(data, null, 2));
              }
            }
          }
          walk('.');
          NODE

      - name: Remove lockfile
        working-directory: deepseek-harness
        run: rm -f pnpm-lock.yaml

      - name: Configure pnpm for ARM64 and node-pty override
        working-directory: deepseek-harness
        run: |
          # 设置 ARM64 架构
          echo "supportedArchitectures[linux][arm64]=true" >> .npmrc
          echo "npm_config_arch=arm64" >> .npmrc
          echo "npm_config_target_arch=arm64" >> .npmrc
          echo "npm_config_platform=linux" >> .npmrc
          # 使用 overrides 将 node-pty 替换为预编译多架构包（解决 ERR_PNPM_UNUSED_PATCH 和版本问题）
          echo "overrides[node-pty]=npm:@homebridge/node-pty-prebuilt-multiarch@^0.14.1" >> .npmrc

      - name: Install dependencies
        working-directory: deepseek-harness
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64
          npm_config_platform: linux
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        working-directory: deepseek-harness
        run: pnpm run build

      - name: Package artifacts
        run: |
          mkdir -p release
          cd deepseek-harness/packages/dsh
          # 自动查找常见构建输出目录，避免 hard-coded dist 不存在的问题
          ARTIFACT_DIR=""
          for dir in dist build lib out bin; do
            if [ -d "$dir" ]; then
              ARTIFACT_DIR="$dir"
              break
            fi
          done
          if [ -z "$ARTIFACT_DIR" ]; then
            echo "No common build directory found, listing current directory:"
            ls -la
            echo "Falling back to copying all files except node_modules, src, test"
            mkdir -p ../../../release
            tar -cf - --exclude=node_modules --exclude=src --exclude=test --exclude=__tests__ . | tar -xf - -C ../../../release
            cp package.json ../../../release/ 2>/dev/null || true
          else
            echo "Found build artifact directory: $ARTIFACT_DIR"
            mkdir -p ../../../release
            cp -r "$ARTIFACT_DIR"/* ../../../release/
            cp package.json ../../../release/
          fi
          cd ../../..
          tar -czvf deepseek-harness-arm64.tar.gz -C release .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: deepseek-harness-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}