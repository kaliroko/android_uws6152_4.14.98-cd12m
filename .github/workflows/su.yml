name: Apply ReSukiSU

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to apply ReSukiSU'
        required: true
        default: 'master'

jobs:
  apply-sukisu:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0   # 关键：获取完整历史，使所有分支可用

      - name: Ensure target branch is available (optional safety)
        run: |
          TARGET="master"
          echo "Requested branch: $TARGET"
          # 如果 origin 上存在该分支则 fetch 并切换，否则跳过（避免因不存在 main 而失败）
          if git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then
            git fetch origin "$TARGET"
            git checkout "$TARGET"
          else
            echo "Remote branch '$TARGET' not found; skipping fetch."
          fi

      - name: Run ReSukiSU integration script
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply ReSukiSU modifications [skip ci]"
          git push origin ${{ github.event.inputs.branch }}
